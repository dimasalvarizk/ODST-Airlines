version: '3.8'

services:
  frontend:
    build:
      context: ./odstairlines-frontend
      dockerfile: Dockerfile
    container_name: odstairlines-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - coolify
      - default
    environment:
      - PORT=3000
      - MAILCHIMP_API_KEY=${MAILCHIMP_API_KEY:-}
      - MAILCHIMP_SERVER_PREFIX=${MAILCHIMP_SERVER_PREFIX:-us11}
      - MAILCHIMP_AUDIENCE_ID=${MAILCHIMP_AUDIENCE_ID:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  coolify:
    external: true
  default:

